spring:
    application:
        name: plus

elasticsearch:
    host: http://localhost:9200
    username: elastic
    password: changeme

ingest:
    queue:
        capacity: 10000
    batch:
        size: 200
        flush-interval-ms: 500
    backpressure:
        strategy: reject  # or "drop"

management:
    endpoint:
        health:
            show-details: always
    endpoints:
        web:
            exposure:
                include: health,info,metrics
    metrics:
        tags:
            application: log-plus